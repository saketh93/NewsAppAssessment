included:
  - NewsAppAssesment
  - NewsAppAssesmentTests

excluded:
  - NewsAppAssesment.xcodeproj
  - NewsAppAssesmentUITests
  - DerivedData

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - array_init
  - comma
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - colon
  - trailing_semicolon
  - redundant_self
  - force_cast
  - comment_spacing
  - opening_brace
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - strict_fileprivate
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 20

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - vm
    - url
    - key

force_cast: error
force_try: error

force_unwrapping:
  severity: error

